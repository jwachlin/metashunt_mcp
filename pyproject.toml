[project]
name = "metashunt-mcp"
version = "0.1.0"
description = "Local MCP server for MetaShunt V2 embedded current sensing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "mcp>=1.0,<2",
]

[project.scripts]
metashunt-mcp = "metashunt_mcp.server:main"
metashunt-mcp-readonly = "metashunt_mcp.server:main_readonly"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metashunt_mcp"]